<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>與黎深的金色記憶球</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Noto+Serif+TC:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;500;600&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Noto+Serif+TC:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"></noscript>
<link rel="prefetch" href="index.html">
<link rel="prefetch" href="quiet-night.html">
<style>
:root{
  /* ===== Terracotta 設計語言 tokens ===== */
  --primary:#C56A3C;        /* 陶土主色 */
  --primary-deep:#A8532C;
  --secondary:#F3E9D8;      /* 暖米色 */
  --surface:#FFFFFF;
  --ink:#111827;            /* 內文文字 */
  --ink-brown:#3E2B1E;      /* 標題墨棕色 */
  --muted-brown:#8B7A63;    /* 輔助文字 */
  --line:#E4D5BE;           /* 分隔線／邊框 */
  --shadow:rgba(62,43,30,.14);

  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-6:24px; --sp-8:32px;
  --fs-1:14px; --fs-2:16px; --fs-3:18px; --fs-4:24px; --fs-5:32px; --fs-6:40px;

  --font-display:'DM Serif Display','Noto Serif TC',serif;
  --font-body:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;}
body{
  margin:0; min-height:100vh; font-family:var(--font-body); color:var(--ink);
  background:
    radial-gradient(circle at 12% 6%, rgba(255,255,255,.65) 0%, transparent 42%),
    radial-gradient(circle at 90% 92%, rgba(197,106,60,.08) 0%, transparent 40%),
    var(--secondary);
  display:flex; justify-content:center; padding:var(--sp-8) var(--sp-4) 64px;
}
.wrap{max-width:480px; width:100%;}

/* ===== 頁首：編輯感標頭 ===== */
.kicker{
  display:flex; align-items:center; justify-content:center; gap:var(--sp-2);
  font-family:var(--font-mono); font-size:11px; letter-spacing:.16em; text-transform:uppercase;
  color:var(--primary-deep); margin-bottom:var(--sp-2);
}
.kicker::before, .kicker::after{content:''; width:22px; height:1px; background:var(--line);}
h1{
  font-family:var(--font-display); font-weight:400; text-align:center; font-size:var(--fs-6);
  color:var(--ink-brown); margin:0 0 var(--sp-2); line-height:1.15;
}
.sub{text-align:center; font-size:var(--fs-1); color:var(--muted-brown); margin-bottom:var(--sp-6);}
.rule{height:1px; background:var(--line); margin:0 0 var(--sp-6);}

/* ===== 進度：頁碼計數 + tick ===== */
.progress-row{display:flex; align-items:center; justify-content:center; gap:var(--sp-3); margin-bottom:var(--sp-6);}
.page-count{font-family:var(--font-mono); font-size:12px; color:var(--muted-brown); letter-spacing:.04em; min-width:52px; text-align:right;}
.dots{display:flex; justify-content:center; gap:6px;}
.dot{width:14px; height:3px; border-radius:2px; background:var(--line); transition:background .2s ease, width .2s ease;}
.dot.active{background:var(--primary); width:22px;}

.card{
  background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:var(--sp-6) var(--sp-6) var(--sp-6);
  box-shadow:0 10px 24px var(--shadow);
  display:none; animation:pop .3s ease;
}
.card.active{display:block;}
@keyframes pop{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

.chapter-num{
  font-family:var(--font-mono); font-size:12px; color:var(--primary); letter-spacing:.1em; margin-bottom:var(--sp-2);
}

.photo-frame{
  width:100%; aspect-ratio:4/3; border-radius:8px; margin-bottom:var(--sp-4); display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:linear-gradient(150deg, var(--secondary), #ead9bd); box-shadow:inset 0 0 0 1px var(--line); position:relative; overflow:hidden;
}
/* 自訂照片：填入路徑且成功載入時自動顯示，沒有圖片或載入失敗則顯示emoji佔位 */
.photo-img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover;}
.photo-frame .glyph{font-size:52px; filter:sepia(.15);}

.photo-title{font-family:var(--font-display); font-weight:700; font-size:var(--fs-4); color:var(--ink-brown); margin-bottom:var(--sp-3); line-height:1.3; text-align:center;}
.photo-text{font-size:var(--fs-2); line-height:1.85; color:var(--ink);}
.extra-link{
  display:inline-block; margin-top:var(--sp-4); font-family:var(--font-mono); font-size:18px; font-weight:600; color:var(--primary-deep);
  text-decoration:none; border-bottom:1px solid var(--primary); padding-bottom:2px; transition:opacity .15s ease;
}
.extra-link:hover, .extra-link:focus-visible{opacity:.72;}

.nav-row{display:flex; justify-content:space-between; gap:var(--sp-3); margin-top:var(--sp-6); border-top:1px solid var(--line); padding-top:var(--sp-4);}
.btn{
  font-family:var(--font-body); font-weight:700; font-size:var(--fs-1); border:1px solid var(--line); border-radius:8px;
  padding:11px 20px; min-height:44px; cursor:pointer; background:var(--surface); color:var(--ink-brown);
  transition:background .15s ease, border-color .15s ease, transform .1s ease;
}
.btn:active{transform:translateY(1px);}
.btn:focus-visible{outline:2px solid var(--primary); outline-offset:2px;}
.btn.primary{background:var(--primary); border-color:var(--primary); color:#fff;}
.btn.primary:hover{background:var(--primary-deep); border-color:var(--primary-deep);}
.btn:disabled{opacity:.4; cursor:not-allowed;}

.ending-card{text-align:center;}
.ending-title{font-family:var(--font-display); font-size:var(--fs-5); color:var(--ink-brown); margin-bottom:var(--sp-4); letter-spacing:.02em;}
.author-box{
  font-family:var(--font-mono); font-size:11.5px; color:var(--muted-brown); line-height:2; padding-top:var(--sp-4);
  border-top:1px solid var(--line); margin-top:var(--sp-4); letter-spacing:.01em;
}
.home-link{display:inline-block; margin-top:var(--sp-6);}
</style>
</head>
<body>
<div class="wrap">
  <div class="kicker">MEMORY ARCHIVE</div>
  <h1>金色記憶球</h1>
  <div class="sub">與黎深的金色記憶將會不斷增加</div>
  <div class="rule"></div>

  <div class="progress-row">
    <div class="page-count" id="page-count">01 / 05</div>
    <div class="dots" id="dots"></div>
  </div>

  <div id="cards"></div>

  <div class="card ending-card" id="card-end">
    <div class="chapter-num">FIN</div>
    <div class="ending-title">THE END.</div>
    <div class="photo-frame" style="background:linear-gradient(150deg,var(--secondary),#ead9bd);">
      <img class="photo-img" id="ending-img" src="" alt="" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
      <div class="glyph" style="display:none;">💗</div>
    </div>
    <p style="font-size:var(--fs-2);color:var(--ink);">謝謝你遊玩這款遊戲。</p>
    <div class="author-box">
      本作品為《戀與深空》同人創作，非商業、僅供粉絲交流。<br>
      故事 / 企劃 / 網頁製作：TsangFei 蒼斐<br>
      —— 黎深生日快樂 9/5 ——
    </div>
    <a class="btn primary home-link" href="index.html">← 返回首頁</a>
  </div>
</div>

<script>
/* 可自由修改以下照片內容／張數；img 留空則用emoji佔位，填路徑後自動改顯示照片 */
const PHOTOS = [
  {glyph:'🧤', title:'比賽前的一景', text:'認真研究賽程表的黎深，沒發現在偷拍。', img:'assets/album-1.jpg'},
  {glyph:'☕', title:'中場休息', text:'不知道什麼時候買的熱可可，讓原本凍僵的手都暖了。', img:'assets/album-2.jpg'},
  {glyph:'📸', title:'比賽結束後', text:'天色暗了下來，廣場開始點燈，雪燈非常美麗。', img:'assets/album-3.jpg'},
  {glyph:'🌌', title:'歸途', text:'夕陽把影子拉得很長，兩個人的影子不知不覺就疊在了一起。', img:'assets/album-4.jpg'},
  {glyph:'❄️💋', title:'耽溺', text:'晚餐後回到了房間，黎深輕擁著你坐在窗邊，看著雪又開始落下。兩人的唇瓣貼近又鬆開，與外頭的寒冷不同，房內逐漸升溫。<br><br>你喃喃念著黎深的名字，像是要融化在他懷裡。 <br>黎深 : ...我想聽更多...你的聲音<br> ', extraLink:'quiet-night.html', extraLabel:'🔞 番外：靜謐的雪夜 →', img:'assets/album-5.jpg'}
];
const ENDING_IMG = 'assets/album-end.jpg';

const cardsWrap = document.getElementById('cards');
const dotsWrap = document.getElementById('dots');
const pageCountEl = document.getElementById('page-count');
let idx = 0;
if(ENDING_IMG){ document.getElementById('ending-img').src = ENDING_IMG; }

PHOTOS.forEach((p,i)=>{
  const card = document.createElement('div');
  card.className = 'card';
  card.id = 'card-'+i;
  card.innerHTML = `
    <div class="chapter-num">${String(i+1).padStart(2,'0')} — 回憶片段</div>
    <div class="photo-frame">
      ${p.img ? `<img class="photo-img" src="${p.img}" alt="" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">` : ''}
      <div class="glyph" style="${p.img?'display:none;':''}">${p.glyph}</div>
    </div>
    <div class="photo-title">${p.title}</div>
    <div class="photo-text">${p.text}</div>
    ${p.extraLink ? `<a class="extra-link" href="${p.extraLink}" target="_blank" rel="noopener">${p.extraLabel}</a>` : ''}
    <div class="nav-row">
      <button class="btn" onclick="go(${i-1})" ${i===0?'disabled':''}>← BACK</button>
      <button class="btn primary" onclick="go(${i+1})">${i===PHOTOS.length-1?'結束':'NEXT →'}</button>
    </div>
  `;
  cardsWrap.appendChild(card);

  const dot = document.createElement('div');
  dot.className = 'dot';
  dot.id = 'dot-'+i;
  dotsWrap.appendChild(dot);
});

function go(i){
  document.querySelectorAll('.card').forEach(c=>c.classList.remove('active'));
  document.querySelectorAll('.dot').forEach(d=>d.classList.remove('active'));
  if(i>=PHOTOS.length){
    document.getElementById('card-end').classList.add('active');
    pageCountEl.textContent = 'FIN';
    return;
  }
  idx = i;
  document.getElementById('card-'+i).classList.add('active');
  const d = document.getElementById('dot-'+i);
  if(d) d.classList.add('active');
  pageCountEl.textContent = String(i+1).padStart(2,'0') + ' / ' + String(PHOTOS.length).padStart(2,'0');
}
go(0);
</script>
</body>
</html>
